trigger:
  batch: true
  branches:
    include:
    - master # to be removed when branch name is changed to main
    - main
    - develop
    - release/*
    - hotfix/*
  paths:
    include:
    - Source/Agv/TransportOrder/**
    - Source/Agv/TransportOrder.Core/**
    - Source/Agv/TransportOrder.Domain/**
    - Source/Agv/TransportOrder.Messages/**
    - Source/Agv/TransportOrder.Persistence.Ef/**
    - Source/Agv/TransportOrder.Routing/**
    - Source/Agv/TransportOrder.WebApi/**
    - Source/Agv/TransportOrder.Test/**
    - Source/Agv/Common/Filter/**
    - Source/Agv/Common.Notification/**
    - Source/Directory.Build.props
    - Source/Directory.Packages.props

# Check out the repository with the Azure Pipelines templates. When this pipeline is executed the first time, there has to be manually given permission in the GUI.
# https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/multi-repo-checkout?view=azure-devops#why-am-i-prompted-to-authorize-resources-the-first-time-i-try-to-check-out-a-different-repository
resources:
  repositories:
  - repository: templates
    type: git
    name: Architecture/Gebhardt.Platform.CI
    ref: main
# Approved OpenAPI baselines. Alias must match the template's 'platformContractsResourceAlias'
# (default 'platform-contracts'). The repo lives in the 'StoreWare Platform' project, matching
# the template's 'platformContractsProject' default used for PR creation.
  - repository: platform-contracts
    type: git
    name: StoreWare Platform/platform-contracts
    ref: refs/heads/main

stages:
- template: backend-template-2.yml@templates
  parameters:
    buildTarget: '$(Build.Repository.LocalPath)/Source/Agv/TransportOrder/TransportOrder.sln'
    publishNuget: false
    publishDocker: true
    dockerImageName: 'gebhardt/fleet-manager/transport-order'
    useNerdbankVersioning: true
    workingDirectory: '$(Build.Repository.LocalPath)/Source'
    testTarget: '$(Build.Repository.LocalPath)/Source/Agv/TransportOrder.Test/**/*.csproj'
    nugetConfigPath: '$(Build.Repository.LocalPath)/Source/Agv/NuGet.Config'
    servicePublishProject: './Agv/TransportOrder/TransportOrder.csproj'
    entryPointProjectName: 'TransportOrder'
    openApiEnabled: true
    openApiProjectTarget: '$(Build.Repository.LocalPath)/Source/Agv/TransportOrder/TransportOrder.csproj'
    runContractPromotion: false
    buildOutputPath: 'Source/artifacts'
    skipResharper: true
    skipVulnerabilityCheck: true