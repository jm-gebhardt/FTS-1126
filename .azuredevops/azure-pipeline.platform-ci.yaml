resources:
  repositories:
    - repository: templates
      type: git
      name: Architecture/Gebhardt.Platform.CI
      ref: refs/heads/main

variables:
- group: 'Architecture - CI'

stages:
  # Shared path: restore/build the large solution once, publish every selected app with --no-build,
  # then run tests and static analysis once for the whole solution. Disabling the package toggles
  # prevents backend-template-2 from adding its single-service Package and Push stages.
  - template: backend-template-2.yml@templates
    parameters:
      serviceName: 'monorepo'
      buildTarget: '$(Build.Repository.LocalPath)/Source/Agv/CompileAgv.sln'
      testTarget: '$(Build.Repository.LocalPath)/Source/Agv/**/*Test/*.csproj'
      workingDirectory: '$(Build.Repository.LocalPath)/Source'
      buildOutputPath: 'Source/artifacts'
      servicePublishProjects: ${{ parameters.services }}
      serviceMigrations: ${{ parameters.services }}
      publishApp: true
      publishDocker: false
      publishNuget: false
      # Produce isolated service migration artifacts in Build, but leave the single-service
      # automatic migrator stages disabled; the fan-out owns packaging and pushing per service.
      generateMigrations: true
      skipResharper: true
      skipVulnerabilityCheck: true
      publishMigrator: false
      openApiEnabled: false
      runContractPromotion: false
      forcePush: false
      nugetConfigPath: '$(Build.Repository.LocalPath)/Source/Agv/NuGet.Config'
  
  # Fan out after the shared validation. Each stage consumes its service directory from the common
  # publish/migrations artifacts and writes uniquely named runtime and migrator image artifacts.
  # No source is compiled here.
  - ${{ if or(ne(variables['Build.Reason'], 'PullRequest'), parameters.forcePush) }}:
      - ${{ each service in parameters.services }}:
          - template: templates-2/stages/package.yml@templates
            parameters:
              stagePrefix: ${{ service.stagePrefix }}
              dependsOn:
                - Validate
              publishDocker: true
              publishNuget: false
              publishMigrator: ${{ service.publishMigrator }}
              serviceName: ${{ service.serviceName }}
              entryPointProjectName: ${{ service.entryPointProjectName }}
              nugetConfigPath: '$(Build.Repository.LocalPath)/Source/Agv/NuGet.Config'
              rootNamespace: ${{ service.rootNamespace }}
              dockerImageName: ${{ service.dockerImageName }}
              dockerImageArtifactName: ${{ service.artifactName }}
              migrationsArtifactName: ${{ service.migrationsArtifactName }}
              migratorImageArtifactName: ${{ service.migratorArtifactName }}
              platformCiResourceAlias: 'templates'
  
  # Push only from main, unless forcePush is deliberately selected at queue time. Forced non-main
  # pushes keep the unique version tag but never move the floating latest tag.
  - ${{ if or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), parameters.forcePush) }}:
      - ${{ each service in parameters.services }}:
          - template: templates-2/stages/push.yml@templates
            parameters:
              stagePrefix: ${{ service.stagePrefix }}
              dependsOn:
                - ${{ service.stagePrefix }}Package
              publishDocker: true
              publishNuget: false
              publishMigrator: ${{ service.publishMigrator }}
              dockerImageArtifactName: ${{ service.artifactName }}
              migratorImageArtifactName: ${{ service.migratorArtifactName }}
              acrServiceConnection: $(acrServiceConnection)
              containerRegistryUrl: 'crffcpocarch.azurecr.io'
              updateLatestTag: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}