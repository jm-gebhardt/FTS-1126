parameters:
  - name: 'components'
    type: object

steps:
  - bash: |
      cat > $(Build.ArtifactStagingDirectory)/VersionFile << EOF
      $(GitVersion.SemVer)
      EOF
      echo $(cat $(Build.ArtifactStagingDirectory)/VersionFile)
    displayName: Create VersionFile
    condition: succeeded()

  - bash: |
      echo "${{ join(';', parameters.components) }}" >> $(Build.ArtifactStagingDirectory)/Components
      echo $(cat $(Build.ArtifactStagingDirectory)/Components)
    displayName: Create Components Artifact

  - task: PublishPipelineArtifact@1
    displayName: Publish Artifact VersionFile
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)
      artifactName: $(Build.Repository.Name)_version
    condition: succeeded()
