parameters:
  - name: 'components'
    type: object

steps:
  - bash: |
      cat > $(Build.ArtifactStagingDirectory)/VersionFile << EOF
      $(GitVersion.SemVer)
      EOF
      echo $(cat VersionFile)
    displayName: Create VersionFile
    condition: succeeded()

  - bash: |
      echo "${{ convertToJson(parameters.components) }}" >> $(Build.ArtifactStagingDirectory)/Components
      echo $(cat Components)
    displayName: Create Components Artifact

  - task: PublishPipelineArtifact@1
    displayName: Publish Artifact VersionFile
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/VersionFile
      artifactName: $(Build.Repository.Name)_version
    condition: succeeded()
