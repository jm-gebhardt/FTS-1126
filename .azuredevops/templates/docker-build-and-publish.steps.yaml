parameters:
  - name: 'components'
    type: object
  - name: 'dotnetversion'
    type: string
    default: '8.0'
  - name: 'containerRegistryConnectionName'

steps:
  - task: Docker@2
    displayName: Login to ACR
    inputs:
      command: login
      containerRegistry: ${{ parameters.containerRegistryConnectionName }}


  - bash: |
      git config --global user.email "ffc@gebhardt-group.com"
      git config --global user.name "FFC Deployment"
      git config pull.rebase false

      # Extract the correct branch name (remove 'refs/heads/' prefix)
      FULLSOURCEBRANCHNAME="${BUILD_SOURCEBRANCH#refs/heads/}"
      echo "##vso[task.setvariable variable=FullSourceBranchName]$FULLSOURCEBRANCHNAME"

      echo "Checking out branch: $FULLSOURCEBRANCHNAME"
      git checkout "$FULLSOURCEBRANCHNAME"
      git pull origin "$FULLSOURCEBRANCHNAME"
    displayName: 'Configure Git and checkout branch'

  - bash: |
      git pull origin master
    displayName: Rebase with Master
    condition: not(eq(variables['Build.SourceBranch'], 'refs/heads/master'))

  - bash: |
      dotnet tool install --global dotnet-affected
    displayName: Install dotnet-affected tool

  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
      - bash: |
          previousCommit=$(git rev-parse HEAD^)
          dotnet-affected -p ./ --to $previousCommit --from $(Build.SourceBranch) --format text -v
        displayName: Get Affected Projects
  - ${{ else }}:
      - bash: |
          dotnet-affected -p ./ --to origin/master --from $(Build.SourceBranch) --format text -v
        displayName: Get Affected Projects

  - bash: |
      components=$(echo '["${{ join('","', parameters.components) }}"]' | jq)
      componentsToBuild=()
      
      echo "$components"
      
      for i in $(echo "$components" | jq -r '.[]')
      do
        project=$(cat affected.txt | grep -i "/Source/Agv/$i/$i.csproj")
        if [[ ! -z $project ]]; then
          componentsToBuild+=("$i")
        fi
      done
      
      echo  "$componentsToBuild"
      componentsToBuildStr=$(IFS=,; echo "${componentsToBuild[*]}")
      
      echo "##vso[task.setvariable variable=componentsToBuild;]$componentsToBuildStr"
    displayName: Collecting Projects To Build

  - ${{ each projectName in parameters.components }}:
      - bash: |
          docker pull crffcpocarch.azurecr.io/gebhardt/fleet-management/${{lower(projectName)}}:latest
        displayName: Pulling image ${{ projectName }}
        condition: and(succeeded(), containsValue(split(variables['componentsToBuild'], ','), '${{projectName}}' ))

  - ${{ each projectName in parameters.components }}:
      - task: Docker@2
        displayName: Building image ${{ projectName }}
        inputs:
          command: 'build'
          Dockerfile: $(SourceDirectory)/Dockerfile
          repository: 'gebhardt/fleet-management/${{projectName}}'
          arguments: --build-arg PROJECT=${{ projectName }} --build-arg DOTNET_VERSION=${{ parameters.dotnetversion }}
          tags: |
            $(GitVersion.SemVer)
            latest
        condition: and(succeeded(), containsValue(split(variables['componentsToBuild'], ','), '${{projectName}}' ))


  - ${{ each projectName in parameters.components }}:
      - task: Docker@2
        displayName: Push docker images ${{ projectName }}
        inputs:
          containerRegistry: ${{ parameters.containerRegistryConnectionName }}
          repository: 'gebhardt/fleet-management/${{projectName}}'
          command: 'push'
          tags: |
            $(GitVersion.SemVer)
            latest
        condition: and(succeeded(), containsValue(split(variables['componentsToBuild'], ','), '${{projectName}}' ))

  - bash: |
      echo "$(componentsToBuild)" >> $(Build.ArtifactStagingDirectory)/Components
      echo $(cat $(Build.ArtifactStagingDirectory)/Components)
    displayName: Create Components Artifact
