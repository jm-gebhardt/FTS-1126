parameters:
  - name: 'components'
    type: object
  - name: 'dotnetversion'
    type: string
    default: '8.0'
  - name: 'containerRegistryConnectionName'

steps:
  - task: Docker@2
    displayName: Login to ACR
    inputs:
      command: login
      containerRegistry: ${{ parameters.containerRegistryConnectionName }}

  - ${{ each projectName in parameters.components }}:
      - docker@2:
        displayName: Building ${{ projectName }}
        inputs:
          command: 'build'
          arguments:
            - PROJECT=${{ projectName }}
            - DOTNET_VERSION=${{ parameters.dotnetversion }}
          tags: |
            $(GitVersion.SemVer)
            latest
        workingDirectory: '$(SourceDirectory)'


  - ${{ each projectName in parameters.components }}:
      - task: Docker@2
        displayName: Push docker images
        inputs:
          containerRegistry: ${{ parameters.containerRegistryConnectionName }}
          repository: 'gebhardt/fleet-management/${{projectName}}'
          command: 'buildAndPush'
          tags: |
            $(GitVersion.SemVer)
            latest
