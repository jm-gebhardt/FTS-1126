steps:
  - powershell: |
        echo "##vso[task.prependpath]$(Agent.ToolsDirectory)/dotnet"
        dotnet tool uninstall --global JetBrains.ReSharper.GlobalTools
        dotnet tool uninstall --local JetBrains.ReSharper.GlobalTools
        dotnet tool install --local JetBrains.ReSharper.GlobalTools --version 2026.2.3
        # Use the dotnet SDK's MSBuild (same as restore/build) instead of the auto-detected Visual Studio one,
        # which cannot resolve references with <UseArtifactsOutput> and reports bogus "Cannot resolve symbol" errors.
        $dotnetPath = (Get-Command dotnet).Source
        # Resolve the SDK from the solution directory so global.json is honored
        Push-Location $(SourceDirectory)
        $sdkVersion = (dotnet --version).Trim()
        Pop-Location
        $msbuildPath = Join-Path (Split-Path $dotnetPath) "sdk\$sdkVersion\MSBuild.dll"
        Write-Host "dotnet: $dotnetPath"
        Write-Host "SDK: $sdkVersion"
        Write-Host "MSBuild: $msbuildPath"
        dotnet --list-sdks
        if (-not (Test-Path $msbuildPath)) {
            Write-Host "##[error]MSBuild.dll not found at $msbuildPath"
            exit 1
        }
        dotnet jb inspectcode $(SourceDirectory)/$(Build.Target) --output=resharper-results.json  --no-build --properties:Configuration=$(Build.Configuration) --dotnetcore="$dotnetPath" --toolset-path="$msbuildPath" --LogLevel=WARN
        dotnet run $(ResharperDirectory)/check-suggestions.cs
        # Check logs.txt
        $logContent = Get-Content ./resharper-logs.txt
        if ($logContent -ne $null -and $logContent.Length -gt 0) {
            Get-Content ./resharper-logs.txt
            exit 1
        }
        else {
            Write-Host "No suggestions found by ReSharper."
        }
    displayName: 'Run ReSharper Command Line Tools and Fail if ReSharper found suggestions'
