trigger:
  batch: true
  branches:
    include:
      - master

variables:
- name: 'SourceDirectory'
  value: 'Source/Agv'
- name: 'Build.Target'
  value: 'CompileAgv.sln'
- name: 'Build.Configuration'
  value: 'Release'
- name: NugetVersion
  value: 6.0

stages:
  ################################################
  # Build
  ################################################
- stage: Build
  jobs:
  ################################################
  # Code Analysis
  ################################################  
  - job: CodeAnalysis
    pool:
      vmImage: windows-latest
    steps:
      - script: git config --system core.longpaths true
      - checkout: self
      - task: NuGetToolInstaller@1
        inputs:
          versionSpec: $(NugetVersion)
      - task: UseDotNet@2
        displayName: 'Install .NET 8 SDK'
        inputs:
          packageType: 'sdk'
          version: '8.0.x'
          performMultiLevelLookup: true
      - task: NuGetCommand@2
        displayName: 'Restoring based on NuGetBackupFeed.config'
        inputs:
          command: 'restore'
          restoreSolution: '$(SourceDirectory)/$(Build.Target)'
          feedsToUse: 'config'
          nugetConfigPath: '$(SourceDirectory)/NuGetBackupFeed.Config'
      - task: DotNetCoreCLI@2
        displayName: 'Build Target ($(Build.Target))'
        inputs:
          command: build
          projects: '$(SourceDirectory)/$(Build.Target)'
          arguments: '--configuration $(Build.Configuration)'
      - task: ResharperCli@2
        inputs:
          solutionOrProjectPath: '$(SourceDirectory)/$(Build.Target)'
          additionalArguments: '--no-build'
          failBuildLevelSelector: Suggestion
          resharperNuGetVersion: '2023.3.3'
  ################################################
  # Run Unit Tests
  ################################################  
  - job: UnitTests
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: NuGetToolInstaller@1
        inputs:
          versionSpec: $(NugetVersion)
      - task: UseDotNet@2
        displayName: 'Install .NET 8 SDK'
        inputs:
          packageType: 'sdk'
          version: '8.0.x'
          performMultiLevelLookup: true
      - task: NuGetCommand@2
        displayName: 'Restoring based on NuGetBackupFeed.config'
        inputs:
          command: 'restore'
          restoreSolution: '$(SourceDirectory)/$(Build.Target)'
          feedsToUse: 'config'
          nugetConfigPath: '$(SourceDirectory)/NuGetBackupFeed.Config'
      - task: DotNetCoreCLI@2
        displayName: 'Run All tests'
        inputs:
          command: 'test'
          projects: '$(SourceDirectory)/**/*[Tt]est*/*.csproj'
          publishTestResults: true
          arguments: '--configuration $(BuildConfiguration) --collect:"XPlat Code Coverage" --settings=coverlet.runsettings'
      - task: CopyFiles@2
        displayName: 'Copy coverage report'
        inputs:
          SourceFolder: '$(Agent.TempDirectory)'
          contents: '**/coverage.cobertura.xml'
          targetFolder: '$(Build.ArtifactStagingDirectory)'
      - publish: '$(Build.ArtifactStagingDirectory)'
        displayName: 'Publish coverage report'
        artifact: coverageReports
  ################################################
  # Coverage Report
  ################################################  
  - job: CoverageReport
    dependsOn:
    - UnitTests
    pool:
      vmImage: ubuntu-latest
    steps:
      - download: current
        artifact: coverageReports
      - task: NuGetToolInstaller@1
        inputs:
          versionSpec: $(NugetVersion)
      - task: reportgenerator@4
        inputs:
          reports: '$(Pipeline.Workspace)/coverageReports/**/coverage.cobertura.xml'
          targetdir: '$(Agent.TempDirectory)/CoverageResults'
          reporttypes: 'Cobertura'
          classfilters: '-*Common.Testing*'
      - task: PublishCodeCoverageResults@1
        displayName: 'Publish code coverage report'
        inputs:
          codeCoverageTool: 'Cobertura'
          summaryFileLocation: '$(Agent.TempDirectory)/CoverageResults/Cobertura.xml'
      - task: BuildQualityChecks@8
        displayName: 'Check build quality'
        inputs:
          checkCoverage: true
          coverageType: lines
          coverageThreshold: 70
          coverageFailOption: fixed
  
  ################################################
  # Integration Test 
  ################################################
- stage: IntegrationTest
  dependsOn: Build
  # condition: and( succeeded(), in(variables['Build.Reason'], 'PullRequest', 'Manual') )
  condition: false
  jobs:
    - job: VersionCheck
      pool:
        vmImage: 'ubuntu-latest'
      displayName: Trigger integration test pipeline
      continueOnError: false
      steps:
        - script: echo "##vso[task.setvariable variable=accGitHash;]$(git rev-parse HEAD)"
        - task: TriggerBuild@4
          displayName: 'Run IntegrationTest Pipeline'
          inputs:
            buildDefinition: AgvDevComb-IntegrationTest
            waitForQueuedBuildsToFinish: true
            waitForQueuedBuildsToFinishRefreshTime: 10
            buildParameters: >
              accGitHash: $(accGitHash)
            authenticationMethod: 'Personal Access Token'
            password: '$(token)'
  