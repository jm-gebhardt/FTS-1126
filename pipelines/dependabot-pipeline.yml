trigger: none # Disable CI trigger

schedules:
- cron: '0 3 * * *' # daily at 3 am
  always: true # run even when there are no code changes
  branches:
    include:
    - master
  batch: true
  displayName: Daily dependency check

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: DependencyCheck
  timeoutInMinutes: 0
  steps:
  - checkout: self
    persistCredentials: true
    clean: true
    fetchDepth: 0

  - task: NuGetAuthenticate@1
    displayName: 'NuGet Authenticate'

  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'
      performMultiLevelLookup: true

  - task: Bash@3
    displayName: 'Update dependencies'
    inputs:
      filePath: $(Build.SourcesDirectory)/pipelines/scripts/update_dependencies.sh
    env:
      AZURE_ARTIFACTS_TOKEN: $(System.AccessToken)
      SOURCE_DIR: $(Build.SourcesDirectory)/Source
      EXCLUDED_DEPENDENCIES: 'OpenTelemetry.Resources.Container AutoMapper Vdma.Lif Sarif.Sdk'
      INCLUDED_DEPENDENCIES: 'Gebhardt.Core'
      REVIEWER_IDS: 'd57dc9ca-b7fe-401f-b7f7-c2ec2fcb5b3d a1963800-1848-4394-a6ed-7d0f733b4359 42f4ca0f-010d-6b7d-9420-a358bd5d6ed2 c01aac72-8af7-4b1d-8393-c787d77add86'
