trigger: none # Disable CI trigger

schedules:
- cron: '0 3 * * *' # daily at 3 am
  always: true # run even when there are no code changes
  branches:
    include:
    - master
  batch: true
  displayName: Daily dependency check

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job:
  timeoutInMinutes: 0
  steps:
  - task: dependabot@2
    inputs:
      experiments: 'allow-refresh-group-with-all-dependencies=false,nuget-native-updater=true'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - bash: |
      # Make script executable and run it
      chmod +x pipelines/scripts/dependabot-postprocess.sh
      ./pipelines/scripts/dependabot-postprocess.sh
    displayName: 'Post-process Dependabot PR'
    condition: succeeded()
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # Workaround for Dependabot SDK-managed package bug (dependabot-core#12544):
  # Dependabot misclassifies packages like EF Core as SDK-managed and skips them.
  # This step checks NuGet directly and creates PRs for those packages.
  - bash: |
      chmod +x pipelines/scripts/nuget-update-check.sh
      ./pipelines/scripts/nuget-update-check.sh
    displayName: 'Check SDK-managed packages for updates'
    condition: always()
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
