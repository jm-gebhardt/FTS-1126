pool:
  vmImage: ubuntu-latest

variables:
- name: 'SourceDirectory'
  value: 'Source/Agv'
- name: 'IntegrationTestSourceDirectory'
  value: 'Source/Agv.IntegrationTest'
- name: 'Build.Target'
  value: 'CompileAgv.sln'
- name: 'Build.Target.IntegrationTest'
  value: 'IntegrationTest.sln'

schedules:
- cron: "0 4 * * *"
  displayName: Daily midnight build
  branches:
    include:
    - main
    - master
trigger: none

pr:
- master
- main

steps:
- task: NuGetAuthenticate@1
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.0.x'
    performMultiLevelLookup: true
- task: DotNetCoreCli@2
  displayName: 'Restoring Source/Agv based on NuGet.config'
  inputs:
    command: 'restore'
    projects: '$(SourceDirectory)/$(Build.Target)'
    feedsToUse: 'config'
    nugetConfigPath: '$(SourceDirectory)/NuGet.Config'
- task: Bash@3
  displayName: 'Check for vulnerabilities in dependencies'
  inputs:
    targetType: 'inline'
    script: |
      set -ex
      # Advisories suppressed via NuGetAuditSuppress in Directory.Packages.props.
      # dotnet list package --vulnerable ignores NuGetAuditSuppress, so we filter them here.
      # Keep in sync with NuGetAuditSuppress entries in Directory.Build.props
      SUPPRESSED_ADVISORIES=(
        "https://github.com/advisories/GHSA-7jgj-8wvc-jh57"
        "https://github.com/advisories/GHSA-cmhx-cq75-c4mj"
        "https://github.com/advisories/GHSA-rvv3-g6hj-g44x"
      )

      OUTPUT=$(dotnet list package --vulnerable --include-transitive)
      echo "${OUTPUT}"

      # Filter out suppressed advisories, then fail if any advisory URLs remain
      FILTERED_OUTPUT="${OUTPUT}"
      for advisory in "${SUPPRESSED_ADVISORIES[@]}"; do
        FILTERED_OUTPUT=$(echo "${FILTERED_OUTPUT}" | grep -v "${advisory}")
      done

      REMAINING=$(echo "${FILTERED_OUTPUT}" | grep "https://github.com/advisories/" || true)
      if [ -n "${REMAINING}" ]; then
        echo "##vso[task.logissue type=error]Unsuppressed vulnerable dependencies found" >&2
        echo "${REMAINING}" >&2
        exit 1
      fi
    workingDirectory: 'Source/Agv'
- task: DotNetCoreCli@2
  displayName: 'Restoring Source/Agv.IntegrationTest based on NuGet.config'
  inputs:
    command: 'restore'
    projects: '$(IntegrationTestSourceDirectory)/$(Build.Target.IntegrationTest)'
    feedsToUse: 'config'
    nugetConfigPath: '$(IntegrationTestSourceDirectory)/NuGet.Config'
- task: Bash@3
  displayName: 'Check for vulnerabilities in dependencies of integration test'
  inputs:
    targetType: 'inline'
    script: |
      set -ex
      # Advisories suppressed via NuGetAuditSuppress in Directory.Packages.props.
      # dotnet list package --vulnerable ignores NuGetAuditSuppress, so we filter them here.
      # Keep in sync with NuGetAuditSuppress entries in Directory.Build.props
      SUPPRESSED_ADVISORIES=(
        "https://github.com/advisories/GHSA-7jgj-8wvc-jh57"
        "https://github.com/advisories/GHSA-cmhx-cq75-c4mj"
        "https://github.com/advisories/GHSA-rvv3-g6hj-g44x"
      )

      OUTPUT=$(dotnet list package --vulnerable --include-transitive)
      echo "${OUTPUT}"

      # Filter out suppressed advisories, then fail if any advisory URLs remain
      FILTERED_OUTPUT="${OUTPUT}"
      for advisory in "${SUPPRESSED_ADVISORIES[@]}"; do
        FILTERED_OUTPUT=$(echo "${FILTERED_OUTPUT}" | grep -v "${advisory}")
      done

      REMAINING=$(echo "${FILTERED_OUTPUT}" | grep "https://github.com/advisories/" || true)
      if [ -n "${REMAINING}" ]; then
        echo "##vso[task.logissue type=error]Unsuppressed vulnerable dependencies found" >&2
        echo "${REMAINING}" >&2
        exit 1
      fi
    workingDirectory: 'Source/Agv.IntegrationTest'
