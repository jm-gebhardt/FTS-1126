version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Express
      - SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    
  wcscommunication:
    build:
      context: ./Source/Agv
      args:
        - PROJECT=WCSCommunication
    image: wcscommunication:latest
    environment:
      - RABBITMQ__HOST=rabbitmq
      - RABBITMQ__USER=${RABBITMQ_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_PASSWORD}
      - "CONNECTIONSTRINGS__WCS=Server=mssql;Database=master;User Id=sa;Password=${MSSQL_SA_PASSWORD}"
    command: dotnet /app/Gebhardt.StoreWare.Agv.WCSCommunication.dll ${WCSCOMMUNICATION_ARGS}
    depends_on:
      - rabbitmq
      - mssql
  devicecommunication:
    build:
      context: ./Source/Agv
      args:
        - PROJECT=DeviceCommunication
    image: devicecommunication:latest
    environment:
      - RABBITMQ__HOST=rabbitmq
      - RABBITMQ__USER=${RABBITMQ_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_PASSWORD}
    command: dotnet /app/Gebhardt.StoreWare.Agv.DeviceCommunication.dll ${DEVICECOMMUNICATION_ARGS}
    depends_on:
      - rabbitmq
  transportorder:
    build:
      context: ./Source/Agv
      args:
        - PROJECT=TransportOrder
    image: transportorder:latest
    environment:
      - RABBITMQ__HOST=rabbitmq
      - RABBITMQ__USER=${RABBITMQ_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_PASSWORD}
    command: dotnet /app/Gebhardt.StoreWare.Agv.TransportOrder.dll ${TRANSPORTORDER_ARGS}
    depends_on:
      - rabbitmq