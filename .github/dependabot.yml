version: 2
registries:
  agvdev-nuget:
    type: nuget-feed
    url: https://pkgs.dev.azure.com/GebhardtGroup/StoreWare/_packaging/AgvDev/nuget/v3/index.json
    username: az
    password: ${{ SYSTEM_ACCESSTOKEN }}

updates:
- package-ecosystem: nuget
  directory: /Source
  registries:
  - agvdev-nuget
  open-pull-requests-limit: 20
  schedule:
    interval: daily
  assignees:
  - "d57dc9ca-b7fe-401f-b7f7-c2ec2fcb5b3d" # is@odw42.onmicrosoft.com
  - "a1963800-1848-4394-a6ed-7d0f733b4359" # arne@odw42.onmicrosoft.com
  - "42f4ca0f-010d-6b7d-9420-a358bd5d6ed2" # s.schrader@gebhardt-group.com
  - "c01aac72-8af7-4b1d-8393-c787d77add86" # j.schmidt@ibs-dev.de
  ignore:
  - dependency-name: "Gebhardt.Core.*" # not on nuget
  - dependency-name: "OpenTelemetry.Resources.Container" # tight to Gebhardt.Core, can be only updated manually
  - dependency-name: "AutoMapper" # version locked at 14.0.0 in Directory.Packages.props
  - dependency-name: "Microsoft.EntityFrameworkCore*"
    update-types: [ "version-update:semver-major" ]
  - dependency-name: "Microsoft.Extensions*"
    update-types: [ "version-update:semver-major" ]
  - dependency-name: "System.*"
    update-types: [ "version-update:semver-major" ]
  - dependency-name: "MassTransit*"
    update-types: [ "version-update:semver-major" ] # block v9+ (commercial license required)
  groups:
    masstransit:
      patterns:
      - "MassTransit*"
    efcore:
      patterns:
      - "Microsoft.EntityFrameworkCore*"
    mstest:
      patterns:
      - "MSTest*"
    quartz:
      patterns:
      - "Quartz*"
    fluentvalidation:
      patterns:
      - "FluentValidation*"
