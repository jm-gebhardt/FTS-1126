version: 2
updates:
  - package-ecosystem: nuget
    directory: /Source
    open-pull-requests-limit: 20
    schedule:
      interval: daily
    assignees:
       - "d57dc9ca-b7fe-401f-b7f7-c2ec2fcb5b3d" # is@odw42.onmicrosoft.com
       - "a1963800-1848-4394-a6ed-7d0f733b4359" # arne@odw42.onmicrosoft.com
       - "42f4ca0f-010d-6b7d-9420-a358bd5d6ed2" # s.schrader@gebhardt-group.com
       - "c01aac72-8af7-4b1d-8393-c787d77add86" # j.schmidt@ibs-dev.de
    ignore:
     - dependency-name: "Microsoft.EntityFrameworkCore*"
       update-types: ["version-update:semver-major"]
     - dependency-name: "Microsoft.Extensions*"
       update-types: ["version-update:semver-major"]
     - dependency-name: "System.*"
       update-types: ["version-update:semver-major"]
     - dependency-name: "MassTransit*"
       update-types: ["version-update:semver-minor"]
       versions: ["<8.5.0"]  # ensure masstransit does not require .net9
    groups:
      masstransit:
          patterns:
            - "MassTransit*"
      efcore:
          patterns:
            - "Microsoft.EntityFrameworkCore*"
      mstest:
          patterns:
            - "MSTest*"
      quartz:
          patterns:
            - "Quartz*"
      fluentvalidation:
          patterns:
            - "FluentValidation*"         