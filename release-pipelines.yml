trigger:
  - master

resources:
  - repo: self

variables:
  - name: 'SourceDirectory'
    value: 'Source/Agv'
  - name: 'releaseDate'
    value: $[format('{0:yyyyMMdd}', pipeline.startTime)]

parameters:
  - name: 'name'
    type: object
    default:
      - DeviceCommunication
      - WCSCommunication
      - TransportOrder

stages:  
  - stage: CreateRelease
    jobs:
      - job: CreateReleaseArchive
        displayName: Create Release Archive
        pool:
          vmImage: ubuntu-latest
        steps:
          - bash: |
              x=`echo "$(Build.SourceVersion)" | head -c 8`; echo "##vso[task.setvariable variable=SubstringSourceVersion;isoutput=true]$x"
            name: BuildOutput
          - bash: |
              x=`echo "$(releaseDate)_$(BuildOutput.SubstringSourceVersion)"`; echo "##vso[task.setvariable variable=imageTag;isoutput=true]$x"
            name: VersionOutput  
          - task: CopyFiles@2
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)'
              Contents: |
                Config/**
                docker-compose.yml
                .env.template
              TargetFolder: '$(Build.ArtifactStagingDirectory)'
              CleanTargetFolder: true
              preserveTimestamp: true
          - task: Bash@3
            displayName: Set container version in docker compose
            inputs:
              targetType: 'inline'
              script: |
                # replace string literal
                sed -i 's/wcscommunication:latest/wcscommunication:$(VersionOutput.imageTag)/g' docker-compose.yml
                sed -i 's/transportorder:latest/transportorder:$(VersionOutput.imageTag)/g' docker-compose.yml
                sed -i 's/devicecommunication:latest/devicecommunication:$(VersionOutput.imageTag)/g' docker-compose.yml
              # no need for additional copy task
              workingDirectory: '$(Build.ArtifactStagingDirectory)'
          - task: Npm@1
            displayName: WebUI - Install npm
            inputs:
              workingDir: '$(SourceDirectory)/ui'
              command: install
          - task: Npm@1
            displayName: WebUI - Build
            inputs:
              workingDir: '$(SourceDirectory)/ui'
              command: custom
              customCommand: run build
          - task: Bash@3
            displayName: WebUI - Copy WebUI to Artifacts
            inputs:
              targetType: 'inline'
              script: |
                OUTPUT_DIR=$(Build.ArtifactStagingDirectory)/Config/caddy/html/ui
                mkdir -p ${OUTPUT_DIR}
                cp -r $(SourceDirectory)/ui/dist/* ${OUTPUT_DIR}
          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'Agv_$(VersionOutput.imageTag)'
              publishLocation: 'Container'

      - job: BuildingContainersOnLinux
        displayName: Build Container on Linux
        dependsOn: CreateReleaseArchive
        variables:
          ImageTag: $[ dependencies.CreateReleaseArchive.outputs['VersionOutput.imageTag'] ]
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: 'StoreWare Container Registry'
          - ${{ each projectName in parameters.name }}:
              - task: Docker@2
                displayName: Build ${{ projectName }}
                inputs:
                  command: build
                  containerRegistry: 'StoreWare Container Registry'
                  repository: 'agv/${{ projectName }}'
                  dockerfile: '$(SourceDirectory)/Dockerfile'
                  arguments: '--build-arg PROJECT=${{ projectName }}'
                  buildContext: ./Source/Agv
                  tags: |
                    latest
                    $(ImageTag)
              
              - task: Docker@2
                displayName: Push ${{ projectName }}
                inputs:
                  command: push
                  containerRegistry: 'StoreWare Container Registry'
                  repository: 'agv/${{ projectName }}'
                  tags: |
                    latest
                    $(ImageTag)
              - task: Docker@2
                displayName: Logout ACR
                inputs:
                  command: logout
                  containerRegistry: 'StoreWare Container Registry'
