# https://raw.githubusercontent.com/vegasbrianc/prometheus/master/prometheus/prometheus.yml
global:
  scrape_interval:     15s
  evaluation_interval: 15s

  external_labels:
      monitor: 'agv.localhost'

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ['prometheus.agv:9090']
  - job_name: 'cadvisor'
    metrics_path: /cadvisor/metrics
    static_configs:
      - targets: ['cadvisor.agv:8080']
  - job_name: 'rabbitmq'
    static_configs:
      - targets: [ 'rabbitmq.agv:15692' ]
  - job_name: 'fluent'
    metrics_path: /api/v1/metrics/prometheus
    static_configs: 
      - targets: [ 'fluent.agv:2020' ]
  - job_name: 'fluent.node'
    static_configs:
      - targets: [ 'fluent.agv:2021' ]
        
  ####################
  - job_name: 'WCSCommunication'
    static_configs:
      - targets: [ 'wcscommunication.agv' ]
  - job_name: 'Transpororder'
    static_configs:
      - targets: [ 'transportorder.agv' ]        
  - job_name: 'DeviceCommunication'
    static_configs:
      - targets: [ 'devicecommunication.agv' ]          