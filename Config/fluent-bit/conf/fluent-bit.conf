[SERVICE]
    flush     5
    daemon    off
    http_server on
    log_level info
    parsers_file parsers.conf


[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224
    
[INPUT]
    Name cpu    

[FILTER]
    name parser
    match json
    key_name log
    parser json
    reserve_data true
    
[FILTER]
    name parser
    match log
    key_name log
    parser log
    reserve_data true    

[OUTPUT]
    name   loki
    match  *
    host  loki.agv
    port  3100
    labels container_name=$container_name,log_level=$LogLevel,AgvId=$State['AssignedAgv'],OrderId=$State['OrderId'],CorrelationId=$State['CorrelationId']

[INPUT]
    name            node_exporter_metrics
    tag             node_metrics
    path.procfs     /host/proc
    path.sysfs      /host/sys

[OUTPUT]
    name            prometheus_exporter
    match           node_metrics
    host            0.0.0.0
    port            2021