variables:
- name: 'SourceDirectory'
  value: 'Source/Agv'
- name: 'Build.Target'
  value: 'CompileAgv.sln'
- name: 'Build.Configuration'
  value: 'Release'
- name: 'CertsFolderPath'
  value: '/home/admin-lvs/Dokumente/AgvDevCopy'
- name: NugetVersion
  value: 6.0


stages:
  ################################################
  # Build
  ################################################
- stage: Build
  jobs:
  ################################################
  # Code Analysis
  ################################################  
  - job: CodeAnalysis
    pool:
      vmImage: windows-latest 
    steps:
      - task: NuGetToolInstaller@1
        inputs:
          versionSpec: $(NugetVersion)
      - task: UseDotNet@2
        displayName: 'Install .NET 6 SDK'
        inputs:
          packageType: 'sdk'
          version: '6.0.x'
          performMultiLevelLookup: true
      - task: NuGetCommand@2
        displayName: 'Restoring based on NuGet.config'
        inputs:
          command: 'restore'
          restoreSolution: '$(SourceDirectory)/$(Build.Target)'
          feedsToUse: 'config'
          nugetConfigPath: '$(SourceDirectory)/NuGet.Config'
      - task: DotNetCoreCLI@2
        displayName: 'Build Target ($(Build.Target))'
        inputs:
          command: build
          projects: '$(SourceDirectory)/$(Build.Target)'
          arguments: '--configuration $(Build.Configuration)'
      - task: ResharperCli@2
        inputs:
          solutionOrProjectPath: '$(SourceDirectory)/$(Build.Target)'
          additionalArguments: '--no-build'
          failBuildLevelSelector: Suggestion
  - job: WebUiCodeAnalysis
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: NuGetToolInstaller@1
        inputs:
          versionSpec: $(NugetVersion)
      - task: Npm@1
        displayName: 'Install node modules'
        inputs:
          workingDir: '$(SourceDirectory)/ui'
          command: install
      - task: Npm@1
        displayName: Build
        inputs:
          workingDir: '$(SourceDirectory)/ui'
          command: custom
          customCommand: run build
      - task: Npm@1
        displayName: Lint
        inputs:
          workingDir: '$(SourceDirectory)/ui'
          command: custom
          customCommand: run lint:check
  ################################################
  # Run Unit Tests
  ################################################  
  - job: UnitTests
    pool:
      vmImage: windows-latest
    steps:
      - task: NuGetToolInstaller@1
        inputs:
          versionSpec: $(NugetVersion)
      - task: UseDotNet@2
        displayName: 'Install .NET 6 SDK'
        inputs:
          packageType: 'sdk'
          version: '6.0.x'
          performMultiLevelLookup: true
      - task: NuGetCommand@2
        displayName: 'Restoring based on NuGet.config'
        inputs:
          command: 'restore'
          restoreSolution: '$(SourceDirectory)/$(Build.Target)'
          feedsToUse: 'config'
          nugetConfigPath: '$(SourceDirectory)/NuGet.Config'
      - task: DotNetCoreCLI@2
        displayName: 'Run All tests'
        inputs:
          command: 'test'
          projects: '$(SourceDirectory)/**/*[Tt]est*/*.csproj'
          publishTestResults: true
          arguments: '--configuration $(BuildConfiguration) --collect:"XPlat Code Coverage" --settings=coverlet.runsettings'
      - task: CopyFiles@2
        displayName: 'Copy coverage report'
        inputs:
          SourceFolder: '$(Agent.TempDirectory)'
          contents: '**/coverage.cobertura.xml'
          targetFolder: '$(Build.ArtifactStagingDirectory)'
      - publish: '$(Build.ArtifactStagingDirectory)'
        displayName: 'Publish coverage report'
        artifact: coverageReports
  - job: WebUiUnitTests
    pool:
      vmImage: windows-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSource: 'spec'
        versionSpec: '16.18.0'
    - task: NuGetToolInstaller@1
      inputs:
        versionSpec: $(NugetVersion)
    - task: Npm@1
      displayName: 'Install node modules'
      inputs:
          workingDir: '$(SourceDirectory)/ui'
          command: install
    - task: Npm@1
      displayName: 'Run Web Unit Tests'
      inputs:
          workingDir: '$(SourceDirectory)/ui'
          command: custom
          customCommand: run coverage
    - task: CopyFiles@2
      displayName: 'Copy coverage report'
      inputs:
          sourceFolder: '$(SourceDirectory)/ui/coverage'
          contents: 'cobertura-coverage.xml'
          targetFolder: '$(Build.ArtifactStagingDirectory)'
    - publish: '$(Build.ArtifactStagingDirectory)'
      displayName: 'Publish coverage report'
      artifact: coverageReportsWeb
  ################################################
  # Coverage Report
  ################################################  
  - job: CoverageReport
    dependsOn:
    - UnitTests
    - WebUiUnitTests
    pool:
      vmImage: windows-latest
    steps:
      - download: current
        artifact: coverageReports
      - download: current
        artifact: coverageReportsWeb
      - task: NuGetToolInstaller@1
        inputs:
          versionSpec: $(NugetVersion)
      - task: reportgenerator@4
        inputs:
          reports: '$(Pipeline.Workspace)/coverageReports/**/coverage.cobertura.xml;$(Pipeline.Workspace)/coverageReportsWeb/*.xml'
          targetdir: '$(Agent.TempDirectory)/CoverageResults'
          reporttypes: 'Cobertura'
      - task: PublishCodeCoverageResults@1
        displayName: 'Publish code coverage report'
        inputs:
          codeCoverageTool: 'Cobertura'
          summaryFileLocation: '$(Agent.TempDirectory)/CoverageResults/Cobertura.xml'
      - task: BuildQualityChecks@8
        displayName: 'Check build quality'
        inputs:
          checkCoverage: true
          coverageType: lines
          coverageThreshold: 70
          coverageFailOption: fixed
  ################################################
  # Sim on Build Agent 
  ################################################
- stage: Sim_on_UbuntuServer
  dependsOn: Build
  condition: and( succeeded(), in(variables['Build.Reason'], 'PullRequest', 'Manual') )
  pool:
    name: AGVDev
  jobs:
  - job: Simulation
    displayName: Preparing and executing simulation
    steps:
    
    - task: CopyFiles@2
      displayName: Copy Certs folder
      inputs:
        Contents: |
          **/*
          !.git/**/*
        sourceFolder: '$(CertsFolderPath)'
        targetFolder: '$(Build.SourcesDirectory)'
        overWrite: true

    - task: CmdLine@2
      displayName: docker compose build
      inputs:
        script: | 
          docker compose build
          exit 0
        workingDirectory: '$(Build.SourcesDirectory)'

    - task: NuGetAuthenticate@1

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: '$(Build.SourcesDirectory)/Source/Agv.IntegrationTest/IntegrationTest.sln'
        feedsToUse: config
        nugetConfigPath: '$(Build.SourcesDirectory)/Source/Agv.IntegrationTest/NuGet.Config'
    
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: dotnet test Source/Agv.IntegrationTest/IntegrationTest.sln --logger trx
      env:
        COMPOSE_FILE: $(Build.SourcesDirectory)/docker-compose.yml
        MQTT_SAMPLES: $(Build.SourcesDirectory)/Source/Agv.IntegrationTest/MqttMessages

    - task: CmdLine@2
      condition: succeededOrFailed()
      displayName: docker compose down
      inputs:
        script: docker compose down
        workingDirectory: '$(Build.SourcesDirectory)'

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testRunner: VSTest
        testResultsFiles: '$(Build.SourcesDirectory)/Source/Agv.IntegrationTest/IntegrationTest/TestResults/*.trx'

    - script: rm -r TestResults
      condition: succeededOrFailed()
      displayName: clean up TestResults
      workingDirectory: '$(Build.SourcesDirectory)/Source/Agv.IntegrationTest/IntegrationTest'