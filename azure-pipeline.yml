variables:
- name: 'SourceDirectory'
  value: 'Source/Agv'
- name: 'Build.Target'
  value: 'CompileAgv.sln'
- name: 'Build.Configuration'
  value: 'Release'

  # Please don't forget to set the variables the variable group inside your Az Devops Account
  # Required denominations
  # - CopiedFolderPath
  # - IsSimulationRequested
- group: BuildAgentSim

stages:
  ################################################
  # Build
  ################################################
- stage: Build
  jobs:
  ################################################
  # Code Analysis
  ################################################  
  - job: CodeAnalysis
    pool:
      vmImage: windows-latest 
    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET 6 SDK'
        inputs:
          packageType: 'sdk'
          version: '6.0.x'
          performMultiLevelLookup: true
      - task: NuGetCommand@2
        displayName: 'Restoring based on NuGet.config'
        inputs:
          command: 'restore'
          restoreSolution: '$(SourceDirectory)/$(Build.Target)'
          feedsToUse: 'config'
          nugetConfigPath: '$(SourceDirectory)/NuGet.Config'
      - task: DotNetCoreCLI@2
        displayName: 'Build Target ($(Build.Target))'
        inputs:
          command: build
          projects: '$(SourceDirectory)/$(Build.Target)'
          arguments: '--configuration $(Build.Configuration)'
      - task: ResharperCli@2
        inputs:
          solutionOrProjectPath: '$(SourceDirectory)/$(Build.Target)'
          additionalArguments: '--no-build'
          failBuildLevelSelector: Suggestion
  - job: WebUiCodeAnalysis
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: Npm@1
        displayName: 'Install node modules'
        inputs:
          workingDir: '$(SourceDirectory)/ui'
          command: install
      - task: Npm@1
        displayName: Build
        inputs:
          workingDir: '$(SourceDirectory)/ui'
          command: custom
          customCommand: run build
      - task: Npm@1
        displayName: Lint
        inputs:
          workingDir: '$(SourceDirectory)/ui'
          command: custom
          customCommand: run lint:check
  ################################################
  # Run Unit Tests
  ################################################  
  - job: UnitTests
    pool:
      vmImage: windows-latest
    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET 6 SDK'
        inputs:
          packageType: 'sdk'
          version: '6.0.x'
          performMultiLevelLookup: true
      - task: NuGetCommand@2
        displayName: 'Restoring based on NuGet.config'
        inputs:
          command: 'restore'
          restoreSolution: '$(SourceDirectory)/$(Build.Target)'
          feedsToUse: 'config'
          nugetConfigPath: '$(SourceDirectory)/NuGet.Config'
      - task: DotNetCoreCLI@2
        displayName: 'Run All tests'
        inputs:
          command: 'test'
          projects: '$(SourceDirectory)/**/*[Tt]est*/*.csproj'
          publishTestResults: true
          arguments: '--configuration $(BuildConfiguration) --collect:"XPlat Code Coverage" --settings=coverlet.runsettings'
      - task: CopyFiles@2
        displayName: 'Copy coverage report'
        inputs:
          SourceFolder: '$(Agent.TempDirectory)'
          contents: '**/coverage.cobertura.xml'
          targetFolder: '$(Build.ArtifactStagingDirectory)'
      - publish: '$(Build.ArtifactStagingDirectory)'
        displayName: 'Publish coverage report'
        artifact: coverageReports
  - job: WebUiUnitTests
    pool:
      vmImage: windows-latest
    steps:
    - task: Npm@1
      displayName: 'Install node modules'
      inputs:
          workingDir: '$(SourceDirectory)/ui'
          command: install
    - task: Npm@1
      displayName: 'Run Web Unit Tests'
      inputs:
          workingDir: '$(SourceDirectory)/ui'
          command: custom
          customCommand: run coverage
    - task: CopyFiles@2
      displayName: 'Copy coverage report'
      inputs:
          sourceFolder: '$(SourceDirectory)/ui/coverage'
          contents: 'cobertura-coverage.xml'
          targetFolder: '$(Build.ArtifactStagingDirectory)'
    - publish: '$(Build.ArtifactStagingDirectory)'
      displayName: 'Publish coverage report'
      artifact: coverageReportsWeb
  ################################################
  # Coverage Report
  ################################################  
  - job: CoverageReport
    dependsOn:
    - UnitTests
    - WebUiUnitTests
    pool:
      vmImage: windows-latest
    steps:
      - download: current
        artifact: coverageReports
      - download: current
        artifact: coverageReportsWeb
      - task: reportgenerator@4
        inputs:
          reports: '$(Pipeline.Workspace)/coverageReports/**/coverage.cobertura.xml;$(Pipeline.Workspace)/coverageReportsWeb/*.xml'
          targetdir: '$(Agent.TempDirectory)/CoverageResults'
          reporttypes: 'Cobertura'
      - task: PublishCodeCoverageResults@1
        displayName: 'Publish code coverage report'
        inputs:
          codeCoverageTool: 'Cobertura'
          summaryFileLocation: '$(Agent.TempDirectory)/CoverageResults/Cobertura.xml'
      - task: BuildQualityChecks@8
        displayName: 'Check build quality'
        inputs:
          checkCoverage: true
          coverageType: lines
          coverageThreshold: 70
          coverageFailOption: fixed
  ################################################
  # Sim on Build Agent 
  ################################################
- stage: Sim_on_UbuntuServer
  condition: eq( variables['IsSimulationRequested'] , 'true')
  pool:
    name: AGVDev
  jobs:
  - job: PrepareSimulation
    displayName: Copy files & Start docker compose
    steps:
    - task: CmdLine@2
      displayName: docker compose down
      inputs:
        script: docker compose down
        workingDirectory: '$(CopiedFolderPath)'
    - task: CopyFiles@2
      displayName: Copy files
      inputs:
        Contents: |
          **/*
          !.git/**/*
        targetFolder: '$(CopiedFolderPath)'
        overWrite: true
    - task: CmdLine@2
      displayName: docker compose up
      inputs:
        script: | 
          docker compose up -d
          exit 0
        workingDirectory: '$(CopiedFolderPath)'