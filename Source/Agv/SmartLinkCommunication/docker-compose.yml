version: '3.8'

########################################################################################################################
# Network 
########################################################################################################################
networks:
  default:
    name: agv_net
    external: true

########################################################################################################################
# Services 
########################################################################################################################
services:
  smartlinkcommunication:
    image: storeware.azurecr.io/agv/smartlinkcommunication:latest
    hostname: smartlinkcommunication.agv
    environment:
      - RABBITMQ__HOST=${RABBITMQ_HOST}
      - RABBITMQ__USER=${RABBITMQ_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_PASSWORD}
      - SMARTLINKCOMMUNICATION_ARGS
      - LOGGING__LOGLEVEL__DEFAULT=${LOGLEVEL}
    command: dotnet /app/Gebhardt.StoreWare.Agv.SmartLinkCommunication.dll ${SMARTLINKCOMMUNICATION_ARGS}
    restart: unless-stopped