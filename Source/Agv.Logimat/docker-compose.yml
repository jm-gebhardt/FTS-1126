version: '3.8'

volumes:
  logimat_data: {}

networks:
  agv_net:
    external: true

services:
  instapick-1:
    image: logimatpublisher:latest 
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - TOPIC=agv/status
      - MSG_FILE=InstaPick-1.txt
    volumes:
      - ./InstaPick-1.txt:/app/InstaPick-1.txt
    networks:
      - agv_net  

  instapick-2:
    image: logimatpublisher:latest 
