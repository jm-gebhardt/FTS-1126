pool:
  vmImage: ubuntu-latest

variables:
- name: 'SourceDirectory'
  value: 'Source/Agv'
- name: 'Build.Target'
  value: 'CompileAgv.sln'

schedules:
  - cron: "0 4 * * *"
    displayName: Daily midnight build
    branches:
      include:
        - main
        - master
trigger: none

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 6 SDK'
    inputs:
      packageType: 'sdk'
      version: '6.0.x'
      performMultiLevelLookup: true
  - task: NuGetAuthenticate@1
  - task: NuGetCommand@2
    displayName: 'Restoring based on NuGet.config'
    inputs:
      command: 'restore'
      restoreSolution: '$(SourceDirectory)/$(Build.Target)'
      feedsToUse: 'config'
      nugetConfigPath: '$(SourceDirectory)/NuGet.Config'
  - task: Bash@3
    displayName: 'Check for vulnerabilities in dependencies'
    inputs:
      targetType: 'inline'
      script: |
        set -ex
        OUTPUT=$(dotnet list package --vulnerable --include-transitive)
        echo "${OUTPUT}"
        VULNERABLE_PROJECTS=($(echo "${OUTPUT}" | awk '/Project `[A-z]+` has the following vulnerable packages/{ print $2}'))
        for i in "${VULNERABLE_PROJECTS[@]}"
        do
        	echo "##vso[task.logissue type=error]${i} has vulnerable dependencies" >&2
        done
        if [ -n "${VULNERABLE_PROJECTS}" ]; then
          exit 1;
        fi
      workingDirectory: 'Source/Agv'
      